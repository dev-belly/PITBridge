name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -e .
      - name: Counterexamples and contracts
        run: python -m unittest discover -s tests -v
      - name: Replay committed evidence
        run: |
          pitbridge verify --out demo
          pitbridge verify-rolling --out demo/rolling
      - name: Generate and replay a fresh report
        run: |
          pitbridge demo --out outputs
          pitbridge verify --out outputs
          pitbridge rolling-demo --out outputs/rolling
          pitbridge verify-rolling --out outputs/rolling
