name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -e .
      - name: Counterexamples and contracts
        run: python -m unittest discover -s tests -v
      - name: Run the Python library example
        run: python examples/decision_time.py
      - name: Run notebook cells against the current package without the pinned install cell
        run: python scripts/check_notebook.py
      - name: Verify the scale runner on a small deterministic workload
        run: pitbridge benchmark --rows 2000 --repeats 2 --out outputs/scaling-ci
      - name: Replay committed evidence
        run: |
          pitbridge verify --out demo
          pitbridge verify-rolling --out demo/rolling
      - name: Generate and replay a fresh report
        run: |
          pitbridge demo --out outputs
          pitbridge verify --out outputs
          pitbridge rolling-demo --out outputs/rolling
          pitbridge verify-rolling --out outputs/rolling
  verify-pandas:
    name: Optional pandas (${{ matrix.os }}, Python ${{ matrix.python-version }}, pandas ${{ matrix.pandas-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
            pandas-version: '2'
          - os: ubuntu-latest
            python-version: '3.12'
            pandas-version: '3'
          - os: windows-latest
            python-version: '3.12'
            pandas-version: '3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the optional example dependency
        run: python -m pip install -e . "pandas==${{ matrix.pandas-version }}.*"
      - name: Counterexamples and optional CSV contracts
        run: python -m unittest discover -s tests -v
      - name: Run the optional CSV example when present
        if: hashFiles('examples/pandas_csv.py') != ''
        run: python examples/pandas_csv.py
  windows-quickstart:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Exercise Windows Git line endings
        run: git config --global core.autocrlf true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Run installation and examples in a fresh environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe examples/decision_time.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe scripts/check_notebook.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pitbridge demo --out outputs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pitbridge verify --out outputs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pitbridge rolling-demo --out outputs/rolling
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pitbridge verify-rolling --out outputs/rolling
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify committed bundles from the Windows checkout
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pitbridge verify --out demo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pitbridge verify-rolling --out demo/rolling
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run the core suite with native Windows text encoding
        env:
          PYTHONUTF8: '0'
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests -v
  distribution:
    name: Installed distribution (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install build
      - name: Build the sdist and then build its wheel
        run: python -m build --outdir dist
      - name: Install without a package index and replay outside the source tree
        env:
          PYTHONUTF8: '0'
        run: python scripts/check_distribution.py dist --output installed-check.json
      - name: Prepare the exact distributions that passed installation and replay
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        env:
          BUILD_SHA: ${{ github.sha }}
        shell: bash
        run: python scripts/release_artifacts.py prepare dist installed-check.json release --commit "$BUILD_SHA"
      - name: Retain the checked release assets
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: checked-distributions
          path: release/*
          if-no-files-found: error
          retention-days: 30

  browser:
    name: Chrome reports and no-install invoice lesson
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - run: python -m pip install -e .
      - name: Compare the exact browser core with SQL and the independent oracle
        run: |
          node scripts/check_trial.mjs
          python scripts/check_trial.py
      - name: Select exact identities in real Chrome
        run: python scripts/check_browser.py
