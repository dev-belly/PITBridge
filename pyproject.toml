[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pitbridge"
version = "0.2.0"
description = "Availability-aware financial feature snapshots with revision lineage"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Repository = "https://github.com/dev-belly/PITBridge"
Reports = "https://dev-belly.github.io/PITBridge/"
Issues = "https://github.com/dev-belly/PITBridge/issues"

[project.optional-dependencies]
figures = ["matplotlib>=3.8,<4"]

[project.scripts]
pitbridge = "pitbridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
